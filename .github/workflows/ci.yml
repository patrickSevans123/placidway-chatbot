# What runs here, and the one thing that does not
#
# Seven checks. Six of them are deterministic, need no secret, and can be rerun
# by anyone who clones the repository: the test suite, the linter, the corpus
# integrity check, the credential scan, the retrieval benchmark and the front-end
# build. The seventh builds the production image and boots it, so a Dockerfile
# that no longer starts is caught here instead of during a deploy.
#
# What is deliberately absent: tests/run_eval.py, the 24-case answer
# evaluation. It calls the chat model for every question, so a run costs money,
# needs a key CI does not have, and its score would depend on whichever model that
# key points at rather than on the commit. A green badge that means "someone's API
# key was in a good mood" is worse than no badge. TEST_RESULTS.md is regenerated
# by hand when a fresh eval is paid for.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The store falls back to BM25 when there is no key, which is what a clean
  # checkout looks like: data/embeddings.npy is gitignored.
  LLM_API_KEY: ""
  EMBEDDING_BACKEND: none

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

  corpus:
    name: corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Seven pages, every price with a currency and a source, no chunk over the
      # size limit, no page smaller than the extractor floor. This is the file a
      # reviewer or a fresh container actually gets, checked from a cold start.
      - name: Check the committed corpus
        run: python -m tests.check_corpus

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scan tracked files for credentials
        run: python -m tests.check_secrets

  retrieval:
    name: retrieval benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # hit@1/3/8 and MRR over 41 labelled questions, plus how many of the 10
      # unanswerable ones the gate catches. No model calls: retrieval only.
      - name: Measure retrieval
        run: python -m tests.retrieval_eval

  frontend:
    name: front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build the static export
        working-directory: frontend
        run: npm run build

      # FastAPI serves `frontend/out` at `/`, so the export has to exist and its
      # asset URLs have to be root-absolute. A relative URL builds and then 404s
      # in production.
      - name: Check the export
        working-directory: frontend
        run: |
          test -f out/index.html
          grep -q '"/_next/' out/index.html
          echo "out/index.html exists and points at /_next/"

  image:
    name: image boots
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: placidway-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A Dockerfile that builds but does not start is the failure that only
      # shows up during a deploy. Boot it, wait for /api/health, fail loudly.
      - name: Boot the container and wait for health
        run: |
          docker run -d --name smoke -p 8099:8000 \
            -e LLM_API_KEY= -e EMBEDDING_BACKEND=none -e DB_PATH=/tmp/ci.db \
            placidway-bot:ci
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://127.0.0.1:8099/api/health -o health.json; then
              cat health.json
              grep -q '"status":"ok"' health.json
              echo "container is healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs smoke
          exit 1
