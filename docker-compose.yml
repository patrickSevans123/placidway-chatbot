services:
  placidway-bot:
    build: .
    image: placidway-bot:latest
    container_name: placidway-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/runtime/app.db
      DATA_DIR: /app/data
    ports:
      # Bound to loopback only: the public entry point is the Cloudflare Tunnel.
      - "127.0.0.1:8099:8000"
    volumes:
      - ./runtime:/app/runtime
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
